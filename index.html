<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeTrip — Anti-Design Neo-Brutalist Trip Planner</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-[#f0f0f0] text-black font-mono transition-colors duration-300 min-h-screen p-4 md:p-8">

  <main class="max-w-4xl mx-auto space-y-8">
    <!-- Header -->
    <header class="border-4 border-black bg-white p-6 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)]">
      <h1 class="font-display font-extrabold text-4xl md:text-6xl tracking-tight uppercase">VIBETRIP 🧳⚡</h1>
      <p class="mt-2 text-lg font-bold">Pick a city, set a vibe, ditch your phone.</p>
    </header>

    <!-- App Form & Output Container -->
    <div id="appContainer"></div>
  </main>

  <!-- JavaScript -->
  <script src="app.js"></script>
</body>
</html>
